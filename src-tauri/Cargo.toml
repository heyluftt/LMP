[package]
name = "lmp-one"
version = "0.3.0"
description = "A smooth native-first desktop media player"
authors = ["heyluftt"]
license = "MIT"
edition = "2021"

[[bin]]
name = "lmp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
quick-xml = "0.39.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

